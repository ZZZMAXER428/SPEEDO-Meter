<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GPS Speedometer</title><style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.speedometer {
    margin: 60px auto;
    width: 280px;
    height: 280px;
    border: 10px solid #444;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#speed {
    font-size: 75px;
    font-weight: bold;
}

.unit {
    color: #aaa;
    font-size: 22px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#status {
    margin-top: 20px;
    color: #00ff88;
}
</style></head><body><h1>🛰️ GPS Speedometer</h1><div class="speedometer">
    <div id="speed">0</div>
    <div class="unit">KM/H</div>
</div><button onclick="startGPS()">📍 Enable Location</button>

<p id="status">Location access required</p><script>

const speedDisplay = document.getElementById("speed");
const status = document.getElementById("status");

function startGPS() {

    // Your custom alert
    alert(
        "📍 Location Access Required!\n\n" +
        "This speedometer uses your GPS location to calculate your actual speed.\n\n" +
        "Please press ALLOW in the next permission popup."
    );

    // Check if Geolocation is supported
    if (!navigator.geolocation) {
        alert("Your browser does not support GPS!");
        return;
    }

    status.textContent = "Requesting location access...";

    navigator.geolocation.watchPosition(
        updateSpeed,
        showError,
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
}

function updateSpeed(position) {

    let speed = position.coords.speed;

    if (speed !== null) {

        let kmh = speed * 3.6;

        speedDisplay.textContent = kmh.toFixed(1);
        status.textContent = "🛰️ GPS Connected";

    } else {

        speedDisplay.textContent = "0";
        status.textContent = "📡 Calculating speed...";

    }
}

function showError(error) {

    status.style.color = "red";

    if (error.code === 1) {
        status.textContent = "❌ Location permission denied!";
    }

    else if (error.code === 2) {
        status.textContent = "❌ GPS location unavailable!";
    }

    else if (error.code === 3) {
        status.textContent = "❌ GPS request timed out!";
    }
}

</script></body>
</html>
